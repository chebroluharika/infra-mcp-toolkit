# API response cache zone (shared across nginx workers)
# 10MB metadata zone (~80K keys), 100MB disk max, entries evicted after 2 min idle
proxy_cache_path /var/cache/nginx/api_cache levels=1:2
    keys_zone=api_cache:10m max_size=100m inactive=2m;

server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression (including proxied API responses)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 4;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript
               application/xml+rss application/json application/javascript;

    # React Router support - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # AI chat proxy - no caching, no buffering (streaming SSE responses)
    location /api/ai {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 30s;
        proxy_buffering off;
        proxy_cache off;
    }

    # API proxy with response caching, buffering, and timeouts
    location /api {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts: overview endpoint can take 15s on cache miss
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 30s;

        # Buffer proxied responses to free backend connections faster
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;

        # Response cache for GET requests (60s TTL)
        proxy_cache api_cache;
        proxy_cache_methods GET;
        proxy_cache_valid 200 60s;
        proxy_cache_valid 404 10s;
        proxy_cache_key $request_uri;

        # Cache stampede protection: when a cached entry expires, only ONE request
        # goes to backend; all other concurrent requests get the stale cached response.
        # This prevents 25 users from triggering 25 identical backend fetches.
        proxy_cache_lock on;
        proxy_cache_lock_timeout 15s;
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503;

        # Bypass cache when user clicks "Refresh" (refresh=true) or for non-GET requests
        set $skip_cache 0;
        if ($arg_refresh = "true") {
            set $skip_cache 1;
        }
        if ($request_method != GET) {
            set $skip_cache 1;
        }
        proxy_cache_bypass $skip_cache;
        proxy_no_cache $skip_cache;

        # Cache status header for debugging (HIT/MISS/STALE/UPDATING/BYPASS)
        add_header X-Cache-Status $upstream_cache_status;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Proxy Streamlit requests - allows embedding AI Assistant without cross-origin issues
    # Streamlit is configured with BASE_URL_PATH=/streamlit, so keep the prefix
    location /streamlit/ {
        proxy_pass http://streamlit:8501/streamlit/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_buffering off;
    }

    # Handle /streamlit without trailing slash (redirect to with slash)
    location = /streamlit {
        return 301 /streamlit/;
    }

    # Streamlit _stcore endpoints (static assets, websocket, health)
    location /streamlit/_stcore/ {
        proxy_pass http://streamlit:8501/streamlit/_stcore/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_buffering off;
    }

    # Streamlit static assets
    location /streamlit/static/ {
        proxy_pass http://streamlit:8501/streamlit/static/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Cache React frontend static assets (exclude /streamlit/ and /api/)
    location ~* ^(?!/streamlit/)(?!/api/).*\.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Modern security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    # CSP: Allow Google Fonts for Streamlit, allow ws/wss for Streamlit websockets
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' ws: wss:; frame-src 'self' https://docs.google.com https://*.google.com;" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
}

